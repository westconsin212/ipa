name: IPA Derle

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: En yeni Xcode'u seç
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -v beta | sort -V | tail -1)
          echo "Kullanılan: $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: XcodeGen kur
        run: brew install xcodegen

      - name: Xcode projesini oluştur
        run: xcodegen generate

      - name: Derle
        run: |
          set -o pipefail
          xcodebuild \
            -project GeoKamera.xcodeproj \
            -scheme GeoKamera \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: |BUILD" || true
          test -d build/Build/Products/Release-iphoneos/GeoKamera.app

      - name: Hata kaydını yükle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hata-kaydi
          path: build.log

      - name: IPA paketle
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/GeoKamera.app Payload/
          zip -qr KonumKamera.ipa Payload

      - name: IPA'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: KonumKamera-ipa
          path: KonumKamera.ipa
