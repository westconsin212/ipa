name: GeoKamera
options:
  bundleIdPrefix: com.konumkamera
  deploymentTarget:
    iOS: "15.0"
targets:
  GeoKamera:
    type: application
    platform: iOS
    sources:
      - GeoKamera
    scheme: {}
    settings:
      base:
        PRODUCT_NAME: GeoKamera
        PRODUCT_BUNDLE_IDENTIFIER: com.konumkamera.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Konum Kamera"
        INFOPLIST_KEY_NSCameraUsageDescription: "Fotoğraf çekmek için kameraya erişim gerekiyor."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Fotoğrafa konum, adres ve koordinat eklemek için konumunuz gerekiyor."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Damgalı fotoğrafları galerinize kaydetmek için izin gerekiyor."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Galeriden fotoğraf seçmek için izin gerekiyor."
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
